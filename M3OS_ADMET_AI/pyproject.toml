[project]
name = "m3os-admet-ai-mcp"
version = "0.1.0"
description = "M3OS MCP server for ADMET-AI prediction and constraint filtering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "admet-ai>=1.4.0",
    "fastmcp>=2.12.5",
    "mcp==1.14.0",
    "numpy==1.26.4",
    "openai>=2.14.0",
    "openpyxl>=3.1.5",
    "pandas==2.1.4",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
