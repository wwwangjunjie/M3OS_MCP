[project]
name = "m3os-tamgen-mcp"
version = "0.1.0"
description = "M3OS MCP server for resident protein-pocket-aware TamGen generation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "biopython==1.84",
  "einops>=0.8,<0.9",
  "mcp==1.14.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "rdkit==2024.3.1",
  "scipy==1.14.1",
  "tensorboardx>=2.6,<3",
  "torch==2.3.0",
  "torch-geometric==2.6.1",
  "tqdm>=4.67,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
