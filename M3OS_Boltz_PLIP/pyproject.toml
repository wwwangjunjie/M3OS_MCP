[project]
name = "m3os-boltz-plip-mcp"
version = "0.1.0"
description = "M3OS MCP server for Boltz complex prediction and PLIP interaction analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boltz[cuda]>=2.2.1",
    "langchain>=1.2.17",
    "langchain-classic>=1.0.6",
    "langchain-openai>=1.2.1",
    "mcp==1.14.0",
    "pandas==2.2.3",
    "torch==2.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
